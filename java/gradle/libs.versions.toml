[versions]
picocli = "4.7.7"
jackson = "3.3.0"
junit = "6.1.3"
dbus-java = "5.2.2"
slf4j = "2.0.17"

[libraries]
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
dbus-java-core = { module = "com.github.hypfvieh:dbus-java-core", version.ref = "dbus-java" }
dbus-java-transport = { module = "com.github.hypfvieh:dbus-java-transport-native-unixsocket", version.ref = "dbus-java" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
